spring.application.name=FTBLR
server.port=${APP_PORT:8084}

# Database
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5431/FTBLR_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:rajabarca}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT
ftblr.app.jwtSecret=${JWT_SECRET:6ZR5kL9pX2mN8qR3vY7wB4cE1tA6fD0gH3jK8mL9nP2qR5sT8vW4yZ7cB0fD3gH6}
ftblr.app.jwtExpirationMs=${JWT_EXPIRATION:86400000}

# Logging
logging.level.root=INFO
logging.level.org.example.ftblr=DEBUG
logging.level.org.hibernate.SQL=${HIBERNATE_SQL_LOG:DEBUG}
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=${HIBERNATE_BINDER_LOG:TRACE}